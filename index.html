<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokens TCG</title>
<meta name="description" content="Tokens: the unplugged collectible card game for middle grades AI literacy.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050710;
    --ink:#f3f6fc;
    --ink-soft:#aebbd6;
    --accent:#5ec8ff;
    --accent-warm:#f0913f;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    /* the blue flower photo is brightest at the center, exactly where this
       centered layout puts the text, so the overlay is a navy vignette that's
       darkest in the middle and eases off toward the edges, letting the petals
       show around the text instead of dimming the whole photo evenly */
    background-image:
      radial-gradient(60% 60% at 50% 50%, rgba(4,8,22,.80), rgba(4,8,22,.62) 60%, rgba(4,8,22,.42) 100%),
      url('assets/home-background.jpg');
    background-size: cover, cover;
    background-position: center, center;
    background-repeat: no-repeat, no-repeat;
    background-color: var(--bg);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(24px,6vw,64px);
    overflow-x:hidden;
  }

  .stage{
    width:100%;
    max-width:800px;
    min-width:0;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(16px,3vw,28px);
  }

  h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:clamp(64px,16vw,168px);
    line-height:.95;
    letter-spacing:.01em;
    margin:0;
    text-wrap:balance;
    color:var(--ink);
    text-shadow:0 4px 32px rgba(0,0,0,.55);
  }

  .divider{
    width:72px;
    height:3px;
    border-radius:2px;
    background:linear-gradient(90deg, var(--accent), var(--accent-warm));
  }

  p.tagline{
    margin:0;
    max-width:34ch;
    font-size:clamp(19px,3.4vw,28px);
    font-weight:500;
    line-height:1.4;
    color:var(--ink-soft);
    text-wrap:balance;
    text-shadow:0 2px 18px rgba(0,0,0,.5);
  }

  .links{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:14px;
    margin-top:clamp(4px,1vw,10px);
  }
  .links a{
    display:inline-flex;
    align-items:center;
    min-height:48px;
    padding:12px 26px;
    border-radius:999px;
    border:1.5px solid rgba(94,200,255,.55);
    background:rgba(8,14,34,.55);
    backdrop-filter:blur(3px);
    color:var(--ink);
    font:700 clamp(16px,2.6vw,19px)/1 'Manrope',sans-serif;
    text-decoration:none;
    transition:background .15s, border-color .15s;
  }
  .links a:hover{ background:rgba(20,40,80,.7); border-color:var(--accent); }
  .links a:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  .links a.primary{ background:var(--accent); border-color:var(--accent); color:#06122a; }
  .links a.primary:hover{ background:#8ad8ff; }
  /* not a link yet: same shape as the buttons, dimmed, with a note underneath */
  .links{ align-items:flex-start; }
  .soon{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .soon .btn{
    display:inline-flex;
    align-items:center;
    min-height:48px;
    padding:12px 26px;
    border-radius:999px;
    border:1.5px dashed rgba(174,187,214,.5);
    background:rgba(8,14,34,.45);
    color:var(--ink-soft);
    font:700 clamp(16px,2.6vw,19px)/1 'Manrope',sans-serif;
    cursor:default;
  }
  .soon small{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--accent-warm);
  }

</style>
</head>
<body>
  <div class="stage">
    <h1>Tokens TCG</h1>
    <div class="divider"></div>
    <p class="tagline">The unplugged collectible card game for middle grades AI literacy — physical cards with real conversations.</p>
    <nav class="links" aria-label="Explore Tokens">
      <a class="primary" href="how_to_play/">How to Play</a>
      <a href="sample_cards/">Alpha Set</a>
      <span class="soon">
        <span class="btn" aria-disabled="true">Educator Resources</span>
        <small>Coming Soon</small>
      </span>
    </nav>
  </div>
</body>
</html>
