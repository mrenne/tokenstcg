<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tokens Player Reference Cards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap">
<link rel="stylesheet" href="../kit.css">
<style>
  /* four quarter-page reference cards per sheet, with dashed cut lines */
  .sheet { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 4.925in 4.925in; width: 7.5in; height: 9.85in; }
  .ref { padding: 12pt 14pt; font-size: 9.8pt; line-height: 1.32; overflow: hidden; border: 1pt dashed #9aa3b5; margin: -.5pt; }
  .ref h1 { font-size: 18pt; margin-bottom: 2pt; }
  .ref h3 { font-size: 11pt; margin: 4pt 0 1pt; }
  .ref ol, .ref ul { padding-left: 13pt; margin-bottom: 3pt; }
  .ref li { margin-bottom: 1.5pt; }
  .goal { font: 800 10pt/1 'Baloo 2', sans-serif; background: #1b1f2a; color: #fff; border-radius: 5pt; padding: 4pt 7pt; display: inline-block; margin: 2pt 0 4pt; }
</style><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @media screen {
    html { background: #060913; }
    body { background: #060913; margin: 0; padding: 16px 16px 48px; }
    .paper { background: #fff; max-width: 8.5in; margin: 0 auto; padding: 0.5in; border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
    .page-break { border-top: 2px dashed #c9cfdb; margin: 0.45in -0.5in; }
    .foot { position: static; margin-top: 0.3in; }
    .toolbar { max-width: 8.5in; margin: 0 auto 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      font: 700 15px/1.3 'Manrope', system-ui, sans-serif; color: #c9d3ea; }
    .toolbar a { color: #5ec8ff; text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; }
    .toolbar a:hover { text-decoration: underline; }
    .toolbar .right { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .toolbar small { font-weight: 600; color: #8b97b3; }
    .toolbar button { min-height: 44px; padding: 0 22px; border-radius: 999px; border: 0; background: #5ec8ff; color: #06122a; font: 800 15px/1 'Manrope', sans-serif; cursor: pointer; }
    .toolbar a:focus-visible, .toolbar button:focus-visible { outline: 3px solid #f0913f; outline-offset: 2px; }
  }
  @media screen and (max-width: 8.6in) {
    .paper { padding: 18px; }
    .page-break { margin: 28px -18px; }
    .cols, .readcard { grid-template-columns: 1fr !important; }
    .steps { grid-template-columns: 1fr 1fr !important; }
    .sheet { width: auto !important; height: auto !important; grid-template-columns: 1fr !important; grid-template-rows: none !important; }
    .sheet > *:not(:first-child) { display: none; }
    .strips { height: auto !important; }
    .strip { min-height: 1.3in; padding: 10px 14px !important; }
    .strip h3 { font-size: 26pt !important; }
    .scale img { width: 100% !important; }
    .scale { gap: 4px !important; }
    .scale .slot { padding: 4px 3px !important; }
    .scale .slot b { font-size: 8.5pt !important; }
    .arrow { font-size: 6.5pt !important; gap: 8px; }
    table { display: block; overflow-x: auto; }
  }
  @media print { .toolbar { display: none !important; } }
</style>
</head>
<body>
<nav class="toolbar" aria-label="Handout">
  <a href="../../">← Educator Resources</a>
  <span class="right"><small>Print on US Letter at 100%</small><button type="button" onclick="window.print()">Print</button></span>
</nav>
<main class="paper">
<div class="sheet">
<!-- the same card four times -->
<template id="ref">
  <div class="ref">
    <div class="kicker">Tokens TCG · Quick Play</div>
    <h1>Player Reference</h1>
    <span class="goal">First to 15 Tokens wins</span>
    <h3>Each turn</h3>
    <ol>
      <li><b>Reboot:</b> turn all your cards upright.</li>
      <li><b>Draw:</b> take 1 card.</li>
      <li><b>Train:</b> once, put a diamond-cost card face-down in your Training Set (1 Data each).</li>
      <li><b>Play:</b> deploy, Task, Audit, use Tools, in any order.</li>
    </ol>
    <h3>With a System that's been out since your last turn</h3>
    <ul>
      <li><b>Run a Task:</b> turn it sideways, gain its Tokens.</li>
      <li><b>Run an Audit:</b> turn it sideways, pick an opponent's <i>sideways</i> System. Both hit with Capability. Flags = Trust → Deprecated.</li>
    </ul>
    <h3>Remember</h3>
    <ul>
      <li>3rd System costs +1 Data, 4th +2, and so on.</li>
      <li>Tools and Actions work right away.</li>
      <li>Flags stay unless a card removes them.</li>
      <li><b>{E}</b> = turn this card sideways to use it.</li>
      <li><b>Big Data 2:</b> may pay by turning a Cost 2+ System sideways.</li>
    </ul>
  </div>
</template>
</div>
<script>
  const t = document.getElementById('ref'), s = document.querySelector('.sheet');
  for (let i = 0; i < 4; i++) s.appendChild(t.content.cloneNode(true));
</script>
</main>
</body></html>
