<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokens — Coming Soon</title>
<meta name="description" content="Tokens: the unplugged collectible card game for middle grades AI literacy.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050710;
    --ink:#f3f6fc;
    --ink-soft:#aebbd6;
    --accent:#5ec8ff;
    --accent-warm:#f0913f;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    /* the card-back photo is brightest and busiest at dead center — exactly
       where this centered layout puts the text — so the overlay is a vignette
       that's darkest in the middle and eases off toward the edges, instead of
       a flat scrim, to counter the image's own brightness where it matters */
    background-image:
      radial-gradient(60% 60% at 50% 50%, rgba(4,6,12,.88), rgba(4,6,12,.58) 60%, rgba(4,6,12,.32) 100%),
      url('assets/tokens_card_back.png');
    background-size: cover, cover;
    background-position: center, center;
    background-repeat: no-repeat, no-repeat;
    background-color: var(--bg);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(24px,6vw,64px);
    overflow-x:hidden;
  }

  .stage{
    width:100%;
    max-width:800px;
    min-width:0;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(16px,3vw,28px);
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:.5em;
    padding:.5em 1.1em;
    border-radius:999px;
    background:rgba(255,255,255,.1);
    backdrop-filter:blur(2px);
    font-family:'JetBrains Mono',monospace;
    font-size:clamp(11px,2vw,13px);
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
  }
  .badge::before{
    content:"";
    width:7px; height:7px;
    border-radius:50%;
    background:var(--accent-warm);
  }

  h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:clamp(64px,16vw,168px);
    line-height:.95;
    letter-spacing:.01em;
    margin:0;
    text-wrap:balance;
    color:var(--ink);
    text-shadow:0 4px 32px rgba(0,0,0,.55);
  }

  .divider{
    width:72px;
    height:3px;
    border-radius:2px;
    background:linear-gradient(90deg, var(--accent), var(--accent-warm));
  }

  p.tagline{
    margin:0;
    max-width:34ch;
    font-size:clamp(19px,3.4vw,28px);
    font-weight:500;
    line-height:1.4;
    color:var(--ink-soft);
    text-wrap:balance;
    text-shadow:0 2px 18px rgba(0,0,0,.5);
  }

</style>
</head>
<body>
  <div class="stage">
    <span class="badge">Coming Soon</span>
    <h1>Tokens</h1>
    <div class="divider"></div>
    <p class="tagline">The unplugged collectible card game for middle grades AI literacy — physical cards with real conversations.</p>
  </div>
</body>
</html>
