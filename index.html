<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokens — Coming Soon</title>
<meta name="description" content="Tokens: the unplugged collectible card game for middle grades AI literacy.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b12;
    --bg-deep:#050509;
    --glow-a:#2f6fed;
    --glow-b:#4fd8ff;
    --ink:#f2f4fb;
    --ink-soft:#a7acc4;
    --line:rgba(255,255,255,.12);
  }
  *{ box-sizing:border-box; }
  img{ max-width:100%; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(60% 50% at 50% 38%, color-mix(in srgb, var(--glow-a) 30%, transparent), transparent 70%),
      radial-gradient(45% 40% at 50% 42%, color-mix(in srgb, var(--glow-b) 22%, transparent), transparent 70%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(24px,6vw,64px);
    overflow-x:hidden;
  }

  .stage{
    width:100%;
    max-width:640px;
    min-width:0;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(18px,3vw,28px);
  }

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:clamp(11px,2.2vw,13px);
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--glow-b);
    font-weight:600;
    margin:0;
  }

  /* NOTE: the source logo file is a JPEG with no alpha channel — its "transparent"
     background is actually a checkerboard baked in as opaque pixels. This light
     card is a stopgap so that checkerboard reads as an intentional paper-like
     backing instead of a glaring mismatch against the dark page; it is not a fix
     for the source file, which needs a true-alpha PNG re-export for other uses. */
  .logo-card{
    width:min(78vw, 480px);
    min-width:0;
    padding:clamp(14px,3vw,22px);
    border-radius:22px;
    /* averages the checkerboard's two baked-in tones (~204 and ~246) rather than
       matching either one, which minimizes how much either tone stands out */
    background:#e1e1e2;
    box-shadow:0 18px 46px rgba(47,111,237,.35), 0 2px 6px rgba(0,0,0,.25);
    animation:float 6s ease-in-out infinite;
  }
  .logo-card img{
    width:100%;
    height:auto;
    display:block;
    border-radius:8px;
  }
  @keyframes float{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-10px); }
  }

  h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-style:italic;
    font-size:clamp(34px,7vw,56px);
    line-height:1.05;
    margin:0;
    text-wrap:balance;
    background:linear-gradient(120deg, var(--ink) 40%, var(--glow-b));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  p.tagline{
    margin:0;
    max-width:46ch;
    font-size:clamp(15px,2.6vw,18px);
    line-height:1.5;
    color:var(--ink-soft);
  }

  .divider{
    width:64px;
    height:2px;
    border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--glow-b), transparent);
    margin:2px 0;
  }

  footer{
    margin-top:clamp(8px,2vw,16px);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:.05em;
    color:rgba(167,172,196,.55);
  }

  @media (prefers-reduced-motion: reduce){
    .logo-card{ animation:none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <p class="eyebrow">AI Literacy · Trading Card Game</p>
    <div class="logo-card">
      <img src="assets/tokens-logo.jpg" alt="Tokens — the unplugged collectible card game for middle grades AI literacy">
    </div>
    <h1>Coming Soon</h1>
    <div class="divider"></div>
    <p class="tagline">The unplugged collectible card game for middle grades AI literacy. No screens, no logins — just real cards, real conversations.</p>
    <footer>tokenstcg</footer>
  </div>
</body>
</html>
