<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokens — Coming Soon</title>
<meta name="description" content="Tokens: the unplugged collectible card game for middle grades AI literacy.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcf6e7;
    --ink:#1f3350;
    --ink-soft:#5b6b85;
    --accent:#2f6fed;
    --accent-warm:#e8793a;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(24px,6vw,64px);
    overflow-x:hidden;
  }

  .stage{
    width:100%;
    max-width:800px;
    min-width:0;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(16px,3vw,28px);
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:.5em;
    padding:.5em 1.1em;
    border-radius:999px;
    background:color-mix(in srgb, var(--accent) 12%, transparent);
    font-family:'JetBrains Mono',monospace;
    font-size:clamp(11px,2vw,13px);
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
  }
  .badge::before{
    content:"";
    width:7px; height:7px;
    border-radius:50%;
    background:var(--accent-warm);
  }

  h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:clamp(64px,16vw,168px);
    line-height:.95;
    letter-spacing:.01em;
    margin:0;
    text-wrap:balance;
    background:linear-gradient(120deg, var(--ink) 55%, var(--accent));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  .divider{
    width:72px;
    height:3px;
    border-radius:2px;
    background:linear-gradient(90deg, var(--accent), var(--accent-warm));
  }

  p.tagline{
    margin:0;
    max-width:34ch;
    font-size:clamp(19px,3.4vw,28px);
    font-weight:500;
    line-height:1.4;
    color:var(--ink-soft);
    text-wrap:balance;
  }

</style>
</head>
<body>
  <div class="stage">
    <span class="badge">Coming Soon</span>
    <h1>Tokens</h1>
    <div class="divider"></div>
    <p class="tagline">The unplugged collectible card game for middle grades AI literacy — physical cards with real conversations.</p>
  </div>
</body>
</html>
